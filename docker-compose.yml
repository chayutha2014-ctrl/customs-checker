services:
  db:
    image: postgres:17
    container_name: customs-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: customs
      POSTGRES_PASSWORD: devpass_local_only
      POSTGRES_DB: customs_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
